<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#F7F9FB" /><text x="80" y="90" fill="#123B6D" style="font-family:Arial,sans-serif;font-size:46px;font-weight:700">Від окремих елементів до синьо-зеленої мережі</text><text x="80" y="135" fill="#46566A" style="font-family:Arial,sans-serif;font-size:24px">Мережа — це не кількість об’єктів. Це зв’язки між ними.</text><rect x="80" y="210" width="272" height="520" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2" /><text x="216.0" y="258" fill="#123B6D" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:24px;font-weight:700">1. Окремі елементи</text><text x="216.0" y="290" fill="#5E6E80" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:17px;font-weight:400">об’єкти поруч</text><rect x="376" y="210" width="272" height="520" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2" /><text x="512.0" y="258" fill="#123B6D" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:24px;font-weight:700">2. Зв’язки</text><text x="512.0" y="290" fill="#5E6E80" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:17px;font-weight:400">коридори між ними</text><rect x="672" y="210" width="272" height="520" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2" /><text x="808.0" y="258" fill="#123B6D" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:24px;font-weight:700">3. Мережа</text><text x="808.0" y="290" fill="#5E6E80" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:17px;font-weight:400">пов’язана логіка</text><rect x="968" y="210" width="272" height="520" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2" /><text x="1104.0" y="258" fill="#123B6D" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:24px;font-weight:700">4. Розрив</text><text x="1104.0" y="290" fill="#5E6E80" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:17px;font-weight:400">бар’єр / відсутній зв’язок</text><rect x="1264" y="210" width="272" height="520" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2" /><text x="1400.0" y="258" fill="#123B6D" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:24px;font-weight:700">5. Стійка система</text><text x="1400.0" y="290" fill="#5E6E80" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:17px;font-weight:400">біорізноманіття + стійкість</text><circle cx="158" cy="410" r="24" fill="#5AAE4A" stroke="#FFFFFF" stroke-width="5" /><circle cx="270" cy="510" r="26" fill="#5AAE4A" stroke="#FFFFFF" stroke-width="5" /><circle cx="230" cy="610" r="20" fill="#5AAE4A" stroke="#FFFFFF" stroke-width="5" /><path d="M 140 560 C 175 520, 205 600, 240 560 S 305 525, 315 560" fill="none" stroke="#2CA9C2" stroke-width="16" stroke-linecap="round" /><rect x="145" y="480" width="40" height="40" rx="6" fill="#B8C1CB" stroke="#A8B2BD" stroke-width="1" /><rect x="275" y="400" width="40" height="40" rx="6" fill="#B8C1CB" stroke="#A8B2BD" stroke-width="1" /><line x1="359" y1="475" x2="385" y2="475" stroke="#123B6D" stroke-width="4" stroke-linecap="round" /><polygon points="385,466 403,475 385,484" fill="#123B6D" /><line x1="655" y1="475" x2="681" y2="475" stroke="#123B6D" stroke-width="4" stroke-linecap="round" /><polygon points="681,466 699,475 681,484" fill="#123B6D" /><line x1="951" y1="475" x2="977" y2="475" stroke="#123B6D" stroke-width="4" stroke-linecap="round" /><polygon points="977,466 995,475 977,484" fill="#123B6D" /><line x1="1247" y1="475" x2="1273" y2="475" stroke="#123B6D" stroke-width="4" stroke-linecap="round" /><polygon points="1273,466 1291,475 1273,484" fill="#123B6D" /><line x1="446" y1="420" x2="513" y2="510" stroke="#2F7D32" stroke-width="7" stroke-linecap="round" stroke-dasharray="13 10" /><line x1="570" y1="408" x2="513" y2="510" stroke="#2F7D32" stroke-width="7" stroke-linecap="round" stroke-dasharray="13 10" /><line